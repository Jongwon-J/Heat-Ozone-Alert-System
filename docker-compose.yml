# 4주차 최소 인프라: Postgres + Airflow(LocalExecutor, 웹서버 없이 scheduler만).
# gate1_analysis.py 등 기존 코드는 ro로 마운트해 컨테이너에서 수정할 수 없다.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: airflow
      PGUSER: airflow
      PGPASSWORD: airflow
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./src:/opt/project/src:ro
      - ./data:/opt/project/data:ro
      - ./output:/opt/project/output
      - ./tests:/opt/project/tests:ro
    command: ["db", "migrate"]

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  pg_data:
  airflow_logs:
